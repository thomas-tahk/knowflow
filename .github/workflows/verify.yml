name: verify

# The non-bypassable gate. Runs the same `verify` command the pre-push hook runs,
# so a local `--no-verify` cannot land unverified code on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
